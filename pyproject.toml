[project]
name = "trident"
version = "0.1.0"
description = "Repository tooling configuration for Trident"
requires-python = ">=3.11"

# After editing dependencies below, run `uv lock` and commit uv.lock.
[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "build",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "site-packages",
]

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
