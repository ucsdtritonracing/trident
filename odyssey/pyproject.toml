[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odyssey"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyzmq",
]

[tool.hatch.build.targets.wheel]
only-include = ["."]
exclude = ["pyproject.toml"]

[tool.hatch.build.targets.wheel.sources]
"." = "odyssey"