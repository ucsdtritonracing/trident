name: lint-format

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpp:
    name: C++ formatting and linting
    runs-on: ubuntu-latest
    
    defaults:
      # Set pixi shell as default so the steps use it automatically
      run:
        shell: pixi run bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure host build for clang-tidy
        run: just configure host

      - name: Run C++ formatting and lint checks
        run: just format-check cpp

  python:
    name: Python formatting and linting
    runs-on: ubuntu-latest
    
    defaults:
      # Set pixi shell as default so the steps use it automatically
      run:
        shell: pixi run bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --locked

      - name: Run Python formatting and lint checks
        run: just format-check python