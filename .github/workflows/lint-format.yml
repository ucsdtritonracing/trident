name: lint-format

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpp:
    name: C++ formatting and linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake ninja-build gcc-arm-none-eabi

      - name: Install just 
        uses: extractions/setup-just@v2
        with: 
          just-version: '1.56.0'

      - name: Configure host build for clang-tidy
        run: just configure host

      - name: Run C++ formatting and lint checks
        run: just format-check cpp

  python:
    name: Python formatting and linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install just 
        uses: extractions/setup-just@v2
        with: 
          just-version: '1.56.0'

      - name: Sync dependencies (fails if uv.lock is out of date)
        run: uv sync --extra dev --locked

      - name: Run Python formatting and lint checks
        run: just format-check python