[workspace]
name = "trident"
version = "0.1.0"
# Pinned pixi version. Keep in sync with tools/scripts/install.sh and .github/workflows/*.yml
requires-pixi = "==0.84.0"
channels = ["conda-forge", "memfault"]
# Enable building a package from source. Currently a preview feature in pixi.
preview = ["pixi-build"]
platforms = ["win-64", "osx-64", "osx-arm64", "linux-64"]

# Build GoogleTest with GCC (MinGW-w64 on Windows)
[workspace.build-variants]
c_compiler = ["gcc"]
cxx_compiler = ["gxx"]

[dependencies]
# C++ dependencies
cmake = ">=3.21"
ninja = "*"
binutils = "*"
zeromq = "*"
cppzmq = "*"
pkg-config = "*"
clang-tools = "*"
libprotobuf = "==7.35.1"

# Python dependencies
python = ">=3.11"
uv = "*"
ruff = ">=0.1.60"
protobuf = "==7.35.1"

# Developer dependencies
just = "*"
pre-commit = "*"

[target.win-64.dependencies]
gcc = "*"
gxx = "*"
# Built from source with MinGW GCC, see packages/gtest/pixi.toml
gtest = { path = "packages/gtest" }

[target.unix.dependencies]
# Prebuilt from conda-forge for Mac and Linux
gtest = "==1.18.0"

[target.linux-64.dependencies]
gcc = "*"
gxx = "*"

[pypi-dependencies]
# Pull in your Python subprojects as editable path dependencies
odyssey = { path = "odyssey", editable = true }
tools = { path = "tools", editable = true }
tests = { path = "tests", editable = true }


