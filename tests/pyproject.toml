[project]
name = "trident-tests"
version = "0.1.0"
description = "Test suite for the trident monorepo"
requires-python = ">=3.11"
dependencies = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_utils"]