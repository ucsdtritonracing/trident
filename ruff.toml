line-length = 100
target-version = "py311"
extend-exclude = [
    "build",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "site-packages",
    "odyssey/src/odyssey/protocol"
]

[lint]
select = ["E", "F", "W", "N", "I"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
